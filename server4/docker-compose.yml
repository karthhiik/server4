version: "3.8"

services:
  server4:
    build: .
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2 -Q content,research
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  celery-fast:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=50 -Q content-fast
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  celery-premium:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=10 -Q content-premium
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: barise_presentations
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  export_data:
  redis_data:
  mongo_data:
