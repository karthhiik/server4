version: "3.8"

services:
  frontend:
    build:
      context: ../lliveupdatedstreaming
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server4
    restart: unless-stopped

  server4:
    build: .
    image: server4_pitch:latest
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      API_PORT: "8080"
      WEBSITES_PORT: "8080"
      DATA_PATH: /app/data
      EMBEDDINGS_PATH: /app/data/embeddings
      CACHE_PATH: /app/data/cache
      RESEARCH_PATH: /app/data/research
      LOGS_PATH: /app/data/logs
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2 -Q content,research
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  celery-fast:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=50 -Q content-fast
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  celery-premium:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=10 -Q content-premium
    env_file: .env
    depends_on:
      - redis
      - mongodb
    volumes:
      - export_data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: barise_presentations
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  export_data:
  redis_data:
  mongo_data:
